<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>intheglobe - Interactive Earth Through Time</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Main 3D Canvas Container -->
    <canvas id="globeCanvas"></canvas>

    <!-- Collapsible Control Panel -->
    <div id="controlPanel" class="control-panel expanded">
        <div class="panel-header">
            <h1 class="panel-title">intheglobe</h1>
            <button id="collapseBtn" class="collapse-btn" aria-label="Collapse control panel">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
            </button>
        </div>

        <div class="panel-content">
            <!-- Year Display & Input -->
            <div class="control-group">
                <label for="yearInput" class="control-label">Year (Ma = Million years ago)</label>
                <div class="year-input-container">
                    <input 
                        type="number" 
                        id="yearInput" 
                        class="year-input" 
                        value="2026" 
                        min="-600000000" 
                        max="250000000"
                        title="Enter year: negative = past, positive = future"
                    >
                    <span class="year-era-label" id="yearEraLabel">Present (2026 AD)</span>
                </div>
            </div>

            <!-- Time Slider (Logarithmic) -->
            <div class="control-group">
                <label for="timeSlider" class="control-label">Time Navigation</label>
                <input 
                    type="range" 
                    id="timeSlider" 
                    class="time-slider" 
                    min="0" 
                    max="100" 
                    value="100"
                    title="Logarithmic scale for precise modern-era navigation"
                >
            </div>

            <!-- Playback Controls -->
            <div class="control-group">
                <div class="playback-controls">
                    <button id="playBtn" class="play-btn active" aria-label="Play/Pause">
                        <svg viewBox="0 0 24 24" width="20" height="20">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                    </button>
                    <div class="speed-buttons">
                        <button class="speed-btn" data-speed="1" aria-label="1x speed">1x</button>
                        <button class="speed-btn" data-speed="2" aria-label="2x speed">2x</button>
                        <button class="speed-btn" data-speed="5" aria-label="5x speed">5x</button>
                        <button class="speed-btn" data-speed="10" aria-label="10x speed">10x</button>
                        <button class="speed-btn" data-speed="100" aria-label="100x speed">100x</button>
                    </div>
                </div>
            </div>

            <!-- Layer Toggle Controls -->
            <div class="control-group">
                <label class="control-label">Visualization Layers</label>
                <div class="layer-toggles">
                    <label class="toggle-label">
                        <input type="checkbox" id="populationToggle" checked>
                        <span class="toggle-text">Population Heatmap</span>
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="coastlinesToggle" checked>
                        <span class="toggle-text">Coastlines</span>
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="atmosphereToggle" checked>
                        <span class="toggle-text">Atmosphere</span>
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="terrainToggle" checked>
                        <span class="toggle-text">Terrain Elevation</span>
                    </label>
                </div>
            </div>

            <!-- Info Panel -->
            <div class="info-panel">
                <p id="infoText">Welcome to intheglobe. Use controls to navigate Earth through 850 million years.</p>
            </div>
        </div>
    </div>

    <!-- Floating Collapsed Button (hidden until collapsed) -->
    <button id="expandBtn" class="expand-btn hidden" aria-label="Expand control panel">
        <svg viewBox="0 0 24 24" width="24" height="24">
            <path d="M9 6l6 6-6 6"/>
        </svg>
    </button>

    <!-- Three.js and Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Application Scripts -->
    <script src="js/geology_math.js"></script>
    <script src="js/shaders.js"></script>
    <script src="js/time_controller.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
