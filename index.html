<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="IntheGlobe — procedural geological history of Earth"><title>IntheGlobe — Deep Time Earth</title><link rel="stylesheet" href="./src/styles.css"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script></head><body><main id="app"><canvas id="globe"></canvas><section class="hud"><header><h1>INTHEGLOBE</h1><p id="era">Present · 0 Ma</p></header><div class="controls"><button id="play">▶ Play</button><button id="stepBack">− Step</button><button id="stepForward">+ Step</button><label class="year">Year <input id="yearInput" type="number" value="0" step="1"></label><button id="go">Go</button></div><div class="timeline-wrap"><input id="timeline" type="range" min="0" max="1000000" value="0"><div class="scale"><span>600 Ma ago</span><span>100 Ma</span><span>2 Ma</span><span>Present</span><span>250 Ma future</span></div></div><label class="country">Follow country <select id="country"></select></label><button id="releaseFollow">Free camera</button><div class="speeds"><button data-speed="1">1×</button><button data-speed="2">2×</button><button data-speed="5">5×</button><button data-speed="10">10×</button><button data-speed="100">100×</button></div><label class="toggle"><input id="heatmap" type="checkbox"> Human population overlay</label><p class="hint">Drag to rotate · Scroll to zoom · Procedural geological model; not a scientific reconstruction.</p></section></main><script type="module" src="./src/main.js"></script></body></html>
